name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Go checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dead_drop
          POSTGRES_PASSWORD: dead_drop
          POSTGRES_DB: dead_drop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dead_drop -d dead_drop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEADDROP_TEST_DATABASE_URL: postgres://dead_drop:dead_drop@localhost:5432/dead_drop_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build CLI
        run: CGO_ENABLED=0 go build -trimpath -o bin/dead-drop ./cmd/dead-drop

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  wasm:
    name: WASM and browser assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build WASM assets
        run: make wasm

      - name: Check browser JavaScript
        run: node --check web/static/deaddrop.js && node --check web/static/ui.js

      - name: Run vector interop harness
        run: node web/static/wasm_vectors.mjs

      - name: Check generated artifact limits
        run: |
          test -f web/static/dead-drop.wasm
          size=$(gzip -c web/static/dead-drop.wasm | wc -c)
          test "$size" -le 1572864
  browser:
    name: Browser UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Build WASM assets
        run: make wasm

      - name: Install browser test dependencies
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:browser

  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Lint chart
        run: helm lint deploy/helm/dead-drop
