image:
  repository: ghcr.io/donkeyx/dead-drop
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

podAnnotations: {}

replicaCount: 2

service:
  type: ClusterIP
  port: 8080

database:
  existingSecret: ""
  existingSecretKey: database-url

env:
  store: postgres
  maxBytes: "16777216"
  defaultTTL: 24h
  maxTTL: 168h
  minTTL: 5m
  trustProxy: "false"
  trustedProxies: ""
  # Optional. Prefer turnstile.existingSecret in production.
  turnstileSiteKey: ""
  turnstileSecret: ""
  smokeBypass: ""

turnstile:
  existingSecret: ""
  siteKeyKey: site-key
  secretKey: secret

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 10m
    memory: 50Mi
  limits:
    cpu: 500m
    memory: 512Mi

startupProbe:
  httpGet:
    path: /startupz
    port: http
  initialDelaySeconds: 0
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 30
  successThreshold: 1

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Deletes TTL-expired drops even if nobody Take'd them.
expire:
  enabled: true
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

nodeSelector: {}
tolerations: []
affinity: {}
