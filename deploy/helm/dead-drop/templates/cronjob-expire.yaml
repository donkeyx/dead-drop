{{- if .Values.expire.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "dead-drop.fullname" . }}-expire
  labels:
    {{- include "dead-drop.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.expire.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.expire.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.expire.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "dead-drop.name" . }}
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: expire
        spec:
          restartPolicy: OnFailure
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: expire
              image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: ["expire"]
              env:
                {{- if .Values.grafana.existingSecret }}
                - name: OTEL_SERVICE_NAME
                  value: dead-drop
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: http/protobuf
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.grafana.existingSecret }}
                      key: {{ .Values.grafana.endpointKey }}
                - name: OTEL_EXPORTER_OTLP_HEADERS
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.grafana.existingSecret }}
                      key: {{ .Values.grafana.headersKey }}
                {{- end }}
                - name: DEADDROP_STORE
                  value: {{ .Values.env.store | quote }}
                - name: DEADDROP_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ required "database.existingSecret is required" .Values.database.existingSecret }}
                      key: {{ .Values.database.existingSecretKey }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          nodeSelector:
            {{- toYaml .Values.nodeSelector | nindent 12 }}
          tolerations:
            {{- toYaml .Values.tolerations | nindent 12 }}
{{- end }}
